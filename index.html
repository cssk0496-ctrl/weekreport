<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekly Hub 로그인</title><link rel="stylesheet" href="styles.css"></head><body>
<main class="login"><section class="brand"><div class="logo">WEEKLY <span>HUB</span></div><div class="hero"><small>SECURE REPORTING WORKSPACE</small><h1>주간업무보고를<br>한곳에서 안전하게.</h1><p>팀별 자료 제출부터 취합 현황과 통합 보고서 관리까지 하나의 포털에서 진행하세요.</p></div><small>Authorized personnel only</small></section>

</body></html>
